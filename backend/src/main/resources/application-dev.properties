# ==========================================================
# PhotoVault Development Profile (H2 PostgreSQL Mode)
# ==========================================================
# By default, runs with file-persisted H2 database in PostgreSQL mode.
# Allows zero-configuration instant startup while maintaining PostgreSQL syntax.
spring.datasource.url=jdbc:h2:file:./data/photovaultdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==========================================================
# Switching to PostgreSQL (Optional / Production):
# To connect to your local PostgreSQL instance, uncomment below:
# ==========================================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/photovault
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=update
