# ==========================================================
# PhotoVault Core Configuration
# ==========================================================
spring.application.name=photovault-backend
spring.profiles.active=dev
server.port=8080

# ==========================================================
# Multipart File Upload Settings (High-Volume Photo Uploads)
# ==========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=500MB

# ==========================================================
# Photo Storage Abstraction Settings
# ==========================================================
# Path relative to backend root or absolute path
photovault.storage.location=../storage
photovault.storage.provider=local

# ==========================================================
# JWT Security Configuration
# ==========================================================
photovault.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
photovault.jwt.expiration-ms=86400000

# ==========================================================
# CORS Configuration
# ==========================================================
photovault.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
